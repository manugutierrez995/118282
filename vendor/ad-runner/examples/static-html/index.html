<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ad Runner static HTML example</title>
    <script src="https://cdn.adrunner.example/v1/ad-runner.min.js" data-ad-runner-site="example.com" defer></script>
  </head>
  <body>
    <div data-ad-runner-slot="top"></div>
    <main>
      <h1>Content remains independent from advertisements</h1>
      <div data-ad-runner-slot="chapter-end"></div>
    </main>
    <div data-ad-runner-slot="mobile-bottom"></div>
  </body>
</html>
